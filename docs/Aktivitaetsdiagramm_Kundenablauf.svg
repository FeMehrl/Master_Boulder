<text x="632" y="1008" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Das nutzt du, um deine Hände für einen</text>
<text x="632" y="1027" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">besseren Griff trocken zu halten.“</text>
