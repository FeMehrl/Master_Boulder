<path d="M326,752 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="62" y="776" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Tritte und Griffe müssen regelmäßig</text>
<text x="62" y="795" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">von Chalk befreit werden. Dafür helfen</text>
<text x="62" y="814" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">dir diese kleinen Bürsten.“</text>
<line x1="340" y1="790" x2="370.0" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M595,965 h281 l14,14 v59 h-295 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M876,965 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="607" y="989" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Hier ist das sogenannte Chalk drin.</text>
<text x="607" y="1008" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Das nutzt du, um deine Hände für einen</text>
<text x="607" y="1027" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">besseren Griff trocken zu halten.“</text>
<line x1="770" y1="965" x2="770" y2="818" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M1145,735 h306 l14,14 v116 h-320 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M1451,735 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="1157" y="759" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Glückwunsch, hier bist du richtig! Du startest</text>
<text x="1157" y="778" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">deine Route an den markierten Startgriffen.</text>
<text x="1157" y="797" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Es dürfen lediglich Griffe der gleichen Farbe</text>
<text x="1157" y="816" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">verwendet werden. Du hast deine Route</text>
<text x="1157" y="835" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">erfolgreich beendet, wenn du oben am</text>
<text x="1157" y="854" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">markierten Topgriff angekommen bist.“</text>
<line x1="1120.0" y1="790" x2="1145" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M1145,885 h306 l14,14 v78 h-320 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M1451,885 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="1157" y="909" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Einweisung abgeschlossen – Gut gemacht!</text>
<text x="1157" y="928" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Denk immer daran: Halte den Sturzbereich</text>
<text x="1157" y="947" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">unter boulderenden Personen frei und starte</text>
<text x="1157" y="966" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">erst, wenn über dir niemand an der Wand ist.“</text>
<line x1="1120.0" y1="890" x2="1145" y2="890" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M1745,760 h276 l14,14 v59 h-290 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M2021,760 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="1757" y="784" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Du hast verloren! Achte immer auf deine</text>
<text x="1757" y="803" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Umgebung und ob jemand an der Wand</text>
<text x="1757" y="822" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">bouldert!“</text>
