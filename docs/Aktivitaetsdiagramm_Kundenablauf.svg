<polyline points="760,490 760,525.0" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polygon points="760,599 860,645 760,691 660,645" fill="#F5F5F5" stroke="#2F3B45" stroke-width="1.6"/>
