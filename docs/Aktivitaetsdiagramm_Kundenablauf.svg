<text x="760" y="320.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Mitarbeiter begrüßt den Kunden</text>
<polyline points="760,254.0 760,290.0" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<path d="M960,278 h356 l14,14 v59 h-370 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M1316,278 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="972" y="302" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Hallo und herzlich willkommen! Du bist neu hier?</text>
<text x="972" y="321" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Dann mach' bitte unsere Sicherheitseinweisung.</text>
<text x="972" y="340" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Betritt dafür den sportlichen Hallenbereich.“</text>
<line x1="920.0" y1="315" x2="960" y2="315" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<rect x="600.0" y="375.0" width="320" height="50" rx="16" fill="#D6EAF8" stroke="#2F3B45" stroke-width="1.6"/>
<text x="760" y="405.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Kunde betritt die Boulderhalle</text>
