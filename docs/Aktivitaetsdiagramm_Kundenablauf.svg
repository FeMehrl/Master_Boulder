<text x="1600" y="805.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">„Du hast verloren!“ anzeigen</text>
<rect x="1480.0" y="862.0" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
