<polyline points="590,895 590,935 30,935 30,475 745,475" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polyline points="1420.0,890 1755,890 1755,150 775,150" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<polyline points="1000,915.0 1000,960" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<circle cx="1000" cy="975" r="15" fill="none" stroke="#000" stroke-width="1.8"/>
<circle cx="1000" cy="975" r="9.5" fill="#000"/>
<path d="M1440,742 h286 l14,14 v78 h-300 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M1726,742 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="1452" y="766" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Du hast verloren! Du hast gerade zwei</text>
<text x="1452" y="785" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Menschen in Gefahr gebracht. Achte immer</text>
<text x="1452" y="804" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">auf deine Umgebung und ob jemand an der</text>
<text x="1452" y="823" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Wand bouldert!“</text>
<line x1="1420.0" y1="790" x2="1440" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M1060,950 h306 l14,14 v116 h-320 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M1366,950 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="1072" y="974" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Glückwunsch, hier bist du richtig! Du startest</text>
<text x="1072" y="993" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">deine Route an den markierten Startgriffen.</text>
<text x="1072" y="1012" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Es dürfen lediglich Griffe der gleichen Farbe</text>
<text x="1072" y="1031" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">verwendet werden. Du hast deine Route</text>
<text x="1072" y="1050" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">erfolgreich beendet, wenn du oben am</text>
<text x="1072" y="1069" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">markierten Topgriff angekommen bist.“</text>
<line x1="1135" y1="950" x2="1135" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<line x1="1120.0" y1="790" x2="1135" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M50,752 h276 l14,14 v59 h-290 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M326,752 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="62" y="776" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Tritte und Griffe müssen regelmäßig</text>
<text x="62" y="795" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">von Chalk befreit werden. Dafür helfen</text>
<text x="62" y="814" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">dir diese kleinen Bürsten.“</text>
<line x1="340" y1="790" x2="370.0" y2="790" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<path d="M620,965 h306 l14,14 v59 h-320 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="1.3"/>
<path d="M926,965 v14 h14" fill="none" stroke="#C9A227" stroke-width="1.3"/>
<text x="632" y="989" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">„Hier ist das sogenannte Chalk drin.</text>
<text x="632" y="1008" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">Das nutzt du, um deine Hände für einen</text>
<text x="632" y="1027" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" fill="#333">besseren Griff trocken zu halten.“</text>
<line x1="770" y1="965" x2="770" y2="818" stroke="#C9A227" stroke-width="1.3" stroke-dasharray="6,4"/>
<rect x="1440" y="975" width="290" height="104" rx="8" fill="#FAFAFA" stroke="#999"/>
<text x="1454" y="1001.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2F3B45">Legende</text>
<rect x="1454" y="1011" width="44" height="22" rx="8" fill="#D6EAF8" stroke="#2F3B45"/>
<text x="1510" y="1026.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#2F3B45">Aktion des Kunden</text>
