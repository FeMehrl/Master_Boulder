<text x="890.0" y="45.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#2F3B45">Ablauf eines neuen Kunden in der VR-Boulderhalle – UML-Aktivitätsdiagramm</text>
<circle cx="760" cy="90" r="13" fill="#000"/>
<polygon points="760,135 775,150 760,165 745,150" fill="#F5F5F5" stroke="#2F3B45" stroke-width="1.6"/>
<polyline points="760,103 760,135" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
<rect x="600.0" y="196.0" width="320" height="58" rx="16" fill="#D6EAF8" stroke="#2F3B45" stroke-width="1.6"/>
<text x="760" y="220.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Kunde kommt am Startpunkt</text>
<text x="760" y="240.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">in der Eingangshalle an</text>
<polyline points="760,165 760,196.0" fill="none" stroke="#2F3B45" stroke-width="1.6" marker-end="url(#pfeil)"/>
