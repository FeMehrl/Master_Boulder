<text x="475" y="805.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">„Bürste“ anzeigen</text>
<rect x="600.0" y="762.0" width="210" height="56" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
<text x="705" y="785.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Pop-up-Fenster</text>
<text x="705" y="805.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">„Chalkbag“ anzeigen</text>
<rect x="880.0" y="762.0" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
<text x="1000" y="785.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Pop-up-Fenster</text>
<text x="1000" y="805.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">„Glückwunsch …“ anzeigen</text>
<rect x="905.0" y="865.0" width="190" height="50" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
<text x="1000" y="895.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Szenario beenden</text>
<rect x="1180.0" y="762.0" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
<text x="1300" y="785.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Pop-up-Fenster</text>
<text x="1300" y="805.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">„Du hast verloren!“ anzeigen</text>
<rect x="1180.0" y="862.0" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.6"/>
<text x="1300" y="885.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">Kunde wird zum Startpunkt</text>
<text x="1300" y="905.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2F3B45">zurückportiert</text>
