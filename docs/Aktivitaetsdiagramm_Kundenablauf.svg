<path d="M320,40 h115 l7,7 v114.9 h-122 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M435,40 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="327" y="56.0" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(1) Begrüßung</text>
<text x="327" y="68.7" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Hallo und herzlich</text>
<text x="327" y="81.3" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">willkommen! Du bist</text>
<text x="327" y="94.0" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">neu hier? Dann</text>
<text x="327" y="106.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">mach' bitte unsere</text>
<text x="327" y="119.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Sicherheitsein-</text>
<text x="327" y="131.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">weisung. Betritt dafür</text>
<text x="327" y="144.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">den sportlichen</text>
<text x="327" y="157.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Hallenbereich.“</text>
<path d="M6,61 h127 l7,7 v76.9 h-134 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M133,61 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="13" y="77.0" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(2) Bürste</text>
<text x="13" y="89.7" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Tritte und Griffe</text>
<text x="13" y="102.3" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">müssen regelmäßig von</text>
<text x="13" y="115.0" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Chalk befreit werden.</text>
<text x="13" y="127.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Dafür helfen dir diese</text>
<text x="13" y="140.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">kleinen Bürsten.“</text>
<path d="M8,486 h136 l7,7 v76.9 h-143 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M144,486 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="15" y="502.0" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(3) Chalkbag</text>
<text x="15" y="514.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Hier ist das sogenannte</text>
<text x="15" y="527.3" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Chalk drin. Das nutzt du,</text>
<text x="15" y="540.0" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">um deine Hände für einen</text>
<text x="15" y="552.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">besseren Griff trocken zu</text>
<text x="15" y="565.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">halten.“</text>
<path d="M8,575.9 h136 l7,7 v76.9 h-143 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M144,575.9 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="15" y="591.9" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(6) Verloren</text>
<text x="15" y="604.5" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Du hast verloren! Achte</text>
<text x="15" y="617.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">immer auf deine</text>
<text x="15" y="629.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Umgebung und ob</text>
<text x="15" y="642.5" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">jemand an der Wand</text>
<text x="15" y="655.1" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">bouldert!“</text>
<path d="M157,486 h133 l7,7 v165.5 h-140 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M290,486 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="164" y="502.0" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(4) Glückwunsch</text>
<text x="164" y="514.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Glückwunsch, hier bist</text>
<text x="164" y="527.3" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">du richtig! Du startest</text>
<text x="164" y="540.0" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">deine Route an den</text>
<text x="164" y="552.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">markierten Startgriffen.</text>
<text x="164" y="565.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Es dürfen lediglich Griffe</text>
<text x="164" y="577.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">der gleichen Farbe</text>
<text x="164" y="590.5" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">verwendet werden. Du</text>
<text x="164" y="603.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">hast deine Route</text>
<text x="164" y="615.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">erfolgreich beendet,</text>
<text x="164" y="628.5" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">wenn du oben am</text>
<text x="164" y="641.1" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">markierten Topgriff</text>
<text x="164" y="653.8" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">angekommen bist.“</text>
<path d="M303,486 h135 l7,7 v127.5 h-142 z" fill="#FFF8DC" stroke="#C9A227" stroke-width="0.8"/>
<path d="M438,486 v7 h7" fill="none" stroke="#C9A227" stroke-width="0.8"/>
<text x="310" y="502.0" font-family="Arial" font-size="11" font-weight="bold" fill="#1F2328">(5) Abschlussmeldung</text>
<text x="310" y="514.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">„Einweisung</text>
<text x="310" y="527.3" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">abgeschlossen – Gut</text>
<text x="310" y="540.0" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">gemacht! Denk immer</text>
<text x="310" y="552.6" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">daran: Halte den Sturz-</text>
<text x="310" y="565.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">bereich unter boul-</text>
<text x="310" y="577.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">derenden Personen frei</text>
<text x="310" y="590.5" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">und starte erst, wenn</text>
<text x="310" y="603.2" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">über dir niemand an der</text>
<text x="310" y="615.9" font-family="Arial" font-size="11" font-weight="normal" fill="#1F2328">Wand ist.“</text>
</svg>
